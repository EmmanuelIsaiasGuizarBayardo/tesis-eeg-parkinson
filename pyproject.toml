[project]
name = "tesis-eeg-parkinson"
version = "0.1.0"
description = "Detección de enfermedad de Parkinson en EEG: validación por sujetos y transferibilidad a Emotiv EPOC X."
readme = "README.md"
requires-python = ">=3.12"

# Sin pines de version: uv.lock fija la resolucion exacta.
dependencies = [
    "mne",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "pyyaml",
    "ipykernel",
    "mne-bids>=0.20.0",
    "mne-icalabel>=0.9.0",
    "onnxruntime>=1.30.0",
    "pyprep>=0.9.0",
    "openneuro-py>=2026.9.1",
    "figuras-cientificas",
    "rich>=15.0.0",
]

[project.scripts]
tesis-eeg-parkinson = "tesis_eeg_parkinson.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyyaml",
    "pybv>=0.8.1",
    "eeglabio>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesis_eeg_parkinson"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
figuras-cientificas = { git = "https://github.com/EmmanuelIsaiasGuizarBayardo/figuras-cientificas" }
