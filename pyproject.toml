[project]
name = "tesis-eeg-parkinson"
version = "0.1.0"
description = "Detección de enfermedad de Parkinson en EEG: validación por sujetos y transferibilidad a Emotiv EPOC X."
readme = "README.md"
requires-python = ">=3.12"

# Sin pines de version: uv.lock fija la resolucion exacta.
dependencies = [
    "mne",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "pyyaml",
    "ipykernel",
]

[project.scripts]
tesis-eeg-parkinson = "tesis_eeg_parkinson.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesis_eeg_parkinson"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
